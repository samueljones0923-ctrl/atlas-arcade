<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Arcade</title>
  <desc id="desc">A glowing globe and compass marker on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102a46"/>
      <stop offset="0.58" stop-color="#071523"/>
      <stop offset="1" stop-color="#08101c"/>
    </linearGradient>
    <linearGradient id="globe" x1="110" y1="90" x2="390" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8cf4ff"/>
      <stop offset="1" stop-color="#22c9e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(182 145) rotate(52) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35dff4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35dff4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20.5" y="20.5" width="471" height="471" rx="111.5" fill="url(#glow)" stroke="#9beefa" stroke-opacity=".18"/>
  <g filter="url(#shadow)">
    <circle cx="245" cy="244" r="150" fill="#0b2237" stroke="url(#globe)" stroke-width="17"/>
    <path d="M95 244h300M245 94c43 42 66 92 66 150s-23 108-66 150M245 94c-43 42-66 92-66 150s23 108 66 150M119 160c34 25 76 37 126 37s92-12 126-37M119 328c34-25 76-37 126-37s92 12 126 37" fill="none" stroke="url(#globe)" stroke-width="12" stroke-linecap="round" opacity=".92"/>
    <path d="M391 256c-48 0-87 39-87 87 0 65 87 126 87 126s87-61 87-126c0-48-39-87-87-87Z" fill="#f8d66d" stroke="#fff4bd" stroke-width="10"/>
    <circle cx="391" cy="343" r="29" fill="#10253a"/>
    <circle cx="391" cy="343" r="11" fill="#67e8f9"/>
  </g>
</svg>
